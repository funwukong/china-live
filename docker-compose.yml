services:
  china-live:
    build: .
    image: china-live:latest
    container_name: china-live
    restart: unless-stopped
    ports:
      - "${PORT:-8577}:8577"
    environment:
      TZ: Asia/Shanghai
      PORT: 8577
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8577/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
